name: Farol Bot 24/7

on:
  workflow_dispatch:
  schedule:
    - cron: '25 */5 * * *'

concurrency:
  group: discord-bot
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar frescor da run
        env:
          GITHUB_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 -c '
          import os, subprocess, sys
          sha = os.environ.get("GITHUB_SHA", "")
          ref = os.environ.get("REF_NAME", "main")
          repo = os.environ.get("REPOSITORY", "")
          url = f"https://github.com/{repo}.git" if repo else "origin"
          try:
              res = subprocess.run(["git", "ls-remote", "--heads", url, ref], capture_output=True, text=True, timeout=15)
              if res.returncode != 0:
                  print("::warning::Falha ao verificar ponta remota (erro de rede ou git). Prosseguindo.")
                  sys.exit(0)
              out = res.stdout.strip()
              if not out:
                  print(f"::warning::Ramo {ref} não encontrado no repositório remoto. Prosseguindo.")
                  sys.exit(0)
              remote_sha = out.split()[0]
              if sha and remote_sha:
                  if not sha.startswith(remote_sha) and not remote_sha.startswith(sha):
                      print(f"::error::Checkout obsoleto! Commit local {sha[:7]} != ponta remota {remote_sha[:7]} no ramo {ref}. Abortando para evitar executar código antigo.")
                      sys.exit(1)
              print(f"Checkout atualizado: {sha[:7]} é a ponta de {ref}. Prosseguindo.")
              sys.exit(0)
          except subprocess.TimeoutExpired:
              print("::warning::Timeout ao conectar ao remoto para verificar frescor. Prosseguindo.")
              sys.exit(0)
          except Exception as exc:
              print(f"::warning::Erro na verificação de frescor ({exc}). Prosseguindo.")
              sys.exit(0)
          '

      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Executar bot
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'auto' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || '' }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || '' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || '' }}
          LLM_MODELS: ${{ vars.LLM_MODELS || '' }}
          DISABLE_FREE_LLMS: ${{ vars.DISABLE_FREE_LLMS || 'false' }}
          # Chaves opcionais por provedor (basta cadastrar a que você usa)
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || '' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || '' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || '' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || '' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || '' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || '' }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY || '' }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY || '' }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY || '' }}
          LLM7_API_KEY: ${{ secrets.LLM7_API_KEY || '' }}
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN || '' }}
          LLM_TIMEOUT: ${{ vars.LLM_TIMEOUT || '60' }}
          LLM_MAX_TOKENS: ${{ vars.LLM_MAX_TOKENS || '1024' }}
          MAX_TOOL_ROUNDS: ${{ vars.MAX_TOOL_ROUNDS || '3' }}
          HISTORY_LEN: ${{ vars.HISTORY_LEN || '10' }}
          BULK_CONCURRENCY: ${{ vars.BULK_CONCURRENCY || '3' }}
          API_TIMEOUT: ${{ vars.API_TIMEOUT || '10' }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL || 'INFO' }}
          HEALTH_PORT: ${{ vars.HEALTH_PORT || '' }}
          DISABLED_APIS: ${{ vars.DISABLED_APIS || '' }}
          ALLOWED_CHANNEL_IDS: ${{ vars.ALLOWED_CHANNEL_IDS || '' }}
          MEMBERS_INTENT: ${{ vars.MEMBERS_INTENT || 'false' }}
          MESSAGE_CONTENT_INTENT: ${{ vars.MESSAGE_CONTENT_INTENT || 'false' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Executa por ~5h35m (20100 segundos). Exit code 124 (timeout) é considerado sucesso da fatia.
          timeout 20100s bash run.sh || [ $? -eq 124 ]

      - name: Encadear próxima execução
        if: success()
        env:
          GH_TOKEN: ${{ secrets.CHAIN_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          # Só agenda se não houver outra execução ativa ou na fila
          ACTIVE_RUNS=$(gh run list --workflow bot.yml --status in_progress --status queued --json databaseId -q '.[]' | wc -l)
          if [ "$ACTIVE_RUNS" -le 1 ]; then
            echo "Nenhuma outra execução concorrente detectada. Encadeando próxima run do Farol..."
            gh workflow run bot.yml || echo "Aviso: Não foi possível disparar novo workflow."
          else
            echo "Já existe outra execução ativa ou na fila (${ACTIVE_RUNS} runs). Encadeamento dispensado."
          fi
