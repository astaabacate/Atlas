name: Farol Bot 24/7

on:
  workflow_dispatch:
  schedule:
    # Rede de segurança: se a corrente se romper, o relógio reergue o bot em até 5h.
    - cron: '25 */5 * * *'
  push:
    # Ligar/reiniciar o bot: basta tocar em um destes arquivos (ver README, seção 5).
    # O merge na main também reinicia o bot, já com o código novo.
    paths:
      - ".github/bot-24x7-enabled"
      - ".github/bot-disabled"
      - ".github/workflows/bot.yml"

concurrency:
  group: discord-bot
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Verificar frescor da run
        env:
          GITHUB_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.CHAIN_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python3 -c '
          import os, subprocess, sys, shlex
          sha = os.environ.get("GITHUB_SHA", "")
          ref = os.environ.get("REF_NAME", "main")
          repo = os.environ.get("REPOSITORY", "")
          url = f"https://github.com/{repo}.git" if repo else "origin"

          def reencaminhar(motivo):
              """Não deixa a corrente morrer: agenda uma run nova, já no commit atualizado."""
              print(f"::warning::Checkout obsoleto ({motivo}). Agendando uma run nova em vez de parar o bot.")
              try:
                  res = subprocess.run(["gh", "workflow", "run", "bot.yml", "--ref", ref],
                                       capture_output=True, text=True, timeout=30)
                  if res.returncode == 0:
                      print("::notice::Nova run do bot agendada com o código atualizado.")
                  else:
                      print(f"::error::Não consegui agendar a run nova: {res.stderr.strip()[:200]}")
              except Exception as exc:
                  print(f"::error::Falha ao agendar a run nova: {exc}")
              sys.exit(0)

          try:
              res = subprocess.run(["git", "ls-remote", "--heads", url, ref], capture_output=True, text=True, timeout=15)
              if res.returncode != 0:
                  print("::warning::Falha ao verificar ponta remota (erro de rede ou git). Prosseguindo.")
                  sys.exit(0)
              out = res.stdout.strip()
              if not out:
                  print(f"::warning::Ramo {ref} não encontrado no repositório remoto. Prosseguindo.")
                  sys.exit(0)
              remote_sha = out.split()[0]
              if sha and remote_sha and not sha.startswith(remote_sha) and not remote_sha.startswith(sha):
                  reencaminhar(f"local {sha[:7]} != ponta remota {remote_sha[:7]} em {ref}")
              print(f"Checkout atualizado: {sha[:7]} é a ponta de {ref}. Prosseguindo.")
              sys.exit(0)
          except subprocess.TimeoutExpired:
              print("::warning::Timeout ao conectar ao remoto para verificar frescor. Prosseguindo.")
              sys.exit(0)
          except Exception as exc:
              print(f"::warning::Erro na verificação de frescor ({exc}). Prosseguindo.")
              sys.exit(0)
          '

      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Interruptor do bot (ligado/desligado)
        id: ligado
        run: |
          if [ -f .github/bot-disabled ]; then
            echo "rodar=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=farol 24/7::DESLIGADO por .github/bot-disabled — o bot não sobe e a corrente para aqui."
          else
            echo "rodar=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=farol 24/7::ligado — o bot sobe por ~5h35m e reagenda a própria execução."
          fi

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Executar bot
        if: steps.ligado.outputs.rodar == 'true'
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'auto' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || '' }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || '' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || '' }}
          LLM_MODELS: ${{ vars.LLM_MODELS || '' }}
          DISABLE_FREE_LLMS: ${{ vars.DISABLE_FREE_LLMS || 'false' }}
          # Chaves opcionais por provedor (basta cadastrar a que você usa)
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || '' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || '' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || '' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || '' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || '' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || '' }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY || '' }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY || '' }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY || '' }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY || '' }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY || '' }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY || '' }}
          ZENMUX_API_KEY: ${{ secrets.ZENMUX_API_KEY || '' }}
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY || '' }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY || '' }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY || '' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || '' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '' }}
          KILOCODE_API_KEY: ${{ secrets.KILOCODE_API_KEY || '' }}
          LLM_TIMEOUT: ${{ vars.LLM_TIMEOUT || '60' }}
          LLM_MAX_TOKENS: ${{ vars.LLM_MAX_TOKENS || '1024' }}
          MAX_TOOL_ROUNDS: ${{ vars.MAX_TOOL_ROUNDS || '3' }}
          HISTORY_LEN: ${{ vars.HISTORY_LEN || '10' }}
          BULK_CONCURRENCY: ${{ vars.BULK_CONCURRENCY || '3' }}
          API_TIMEOUT: ${{ vars.API_TIMEOUT || '10' }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL || 'INFO' }}
          HEALTH_PORT: ${{ vars.HEALTH_PORT || '' }}
          DISABLED_APIS: ${{ vars.DISABLED_APIS || '' }}
          ALLOWED_CHANNEL_IDS: ${{ vars.ALLOWED_CHANNEL_IDS || '' }}
          MEMBERS_INTENT: ${{ vars.MEMBERS_INTENT || 'false' }}
          MESSAGE_CONTENT_INTENT: ${{ vars.MESSAGE_CONTENT_INTENT || 'false' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Executa por ~5h35m (20100 segundos). Exit code 124 (timeout) é considerado sucesso da fatia.
          timeout 20100s bash run.sh || [ $? -eq 124 ]

      - name: Encadear próxima execução
        if: success() && steps.ligado.outputs.rodar == 'true'
        env:
          GH_TOKEN: ${{ secrets.CHAIN_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          # Continua no MESMO ramo que começou (main ou um branch de sessão).
          ACTIVE_RUNS=$(gh run list --workflow bot.yml --status in_progress --status queued --json databaseId -q '.[]' | wc -l)
          if [ "$ACTIVE_RUNS" -le 1 ]; then
            echo "Nenhuma outra execução concorrente detectada. Encadeando próxima run do Farol em ${GITHUB_REF_NAME}..."
            gh workflow run bot.yml --ref "${GITHUB_REF_NAME}" \
              || echo "::warning::Não consegui encadear (o vigia retoma em até 30 minutos)."
          else
            echo "Já existe outra execução ativa ou na fila (${ACTIVE_RUNS} runs). Encadeamento dispensado."
          fi
