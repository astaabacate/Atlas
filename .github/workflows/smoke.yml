name: Smoke LLM Providers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: "1"
      SMOKE_TIMEOUT: ${{ vars.SMOKE_TIMEOUT || '30' }}
      SMOKE_CONCURRENCY: ${{ vars.SMOKE_CONCURRENCY || '4' }}
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'auto' }}
      LLM_MODEL: ${{ vars.LLM_MODEL || '' }}
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL || '' }}
      LLM_MODELS: ${{ vars.LLM_MODELS || '' }}
      DISABLE_FREE_LLMS: ${{ vars.DISABLE_FREE_LLMS || 'false' }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY || '' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || '' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || '' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || '' }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || '' }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || '' }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || '' }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY || '' }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY || '' }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY || '' }}
      LLM7_API_KEY: ${{ secrets.LLM7_API_KEY || '' }}
      POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN || '' }}
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Sondar provedores LLM ao vivo
        run: python scripts/smoke_llm.py --timeout "$SMOKE_TIMEOUT" --concurrency "$SMOKE_CONCURRENCY"
