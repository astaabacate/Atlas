name: Smoke LLM Providers

on:
  workflow_dispatch:
  push:
    # Qualquer mudança no pool de LLM roda a sonda ao vivo de novo (é assim que o
    # projeto confirma quem está realmente respondendo antes de confiar no corredor).
    branches: ["arena/01a0b13c-atlas"]
    paths:
      - "llm/**"
      - "scripts/smoke_llm.py"
      - ".github/workflows/smoke.yml"

permissions:
  # contents: write para publicar reports/smoke-llm.md (a prova ao vivo de quem respondeu)
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: "1"
      SMOKE_TIMEOUT: ${{ vars.SMOKE_TIMEOUT || '30' }}
      SMOKE_CONCURRENCY: ${{ vars.SMOKE_CONCURRENCY || '4' }}
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'auto' }}
      LLM_MODEL: ${{ vars.LLM_MODEL || '' }}
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL || '' }}
      LLM_MODELS: ${{ vars.LLM_MODELS || '' }}
      DISABLE_FREE_LLMS: ${{ vars.DISABLE_FREE_LLMS || 'false' }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY || '' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || '' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || '' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || '' }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || '' }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || '' }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || '' }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY || '' }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY || '' }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY || '' }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY || '' }}
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY || '' }}
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY || '' }}
      ZENMUX_API_KEY: ${{ secrets.ZENMUX_API_KEY || '' }}
      MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY || '' }}
      SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY || '' }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY || '' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || '' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '' }}
      KILOCODE_API_KEY: ${{ secrets.KILOCODE_API_KEY || '' }}
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Sondar provedores LLM ao vivo
        id: sonda
        run: |
          set -o pipefail
          python scripts/smoke_llm.py --timeout "$SMOKE_TIMEOUT" --concurrency "$SMOKE_CONCURRENCY" \
            --out reports/smoke-llm.md | tee /tmp/sonda.txt
          status=${PIPESTATUS[0]}
          {
            echo "## Sonda de provedores LLM — \`${{ github.sha }}\`"
            echo
            sed -n '1,80p' reports/smoke-llm.md
          } > /tmp/resumo.md
          if [ -f "$GITHUB_STEP_SUMMARY" ]; then cat /tmp/resumo.md >> "$GITHUB_STEP_SUMMARY"; fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publicar resultado no branch (prova ao vivo)
        # Publica mesmo quando nenhum provedor respondeu: 🔴 também é resultado.
        run: |
          set -uo pipefail
          if [ ! -f reports/smoke-llm.md ]; then echo "::warning title=smoke::relatório não foi gerado"; exit 0; fi
          conteudo=$(base64 -w0 reports/smoke-llm.md)
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/reports/smoke-llm.md?ref=${GITHUB_REF_NAME}" --jq .sha 2>/dev/null || true)
          if [ -n "$sha" ]; then
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/reports/smoke-llm.md" \
              -f message="chore(smoke): resultado ao vivo da sonda ${GITHUB_RUN_ID} [skip ci]" \
              -f content="$conteudo" -f sha="$sha" -f branch="${GITHUB_REF_NAME}" >/dev/null \
              && echo "::notice title=smoke::reports/smoke-llm.md atualizado"
          else
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/reports/smoke-llm.md" \
              -f message="chore(smoke): resultado ao vivo da sonda ${GITHUB_RUN_ID} [skip ci]" \
              -f content="$conteudo" -f branch="${GITHUB_REF_NAME}" >/dev/null \
              && echo "::notice title=smoke::reports/smoke-llm.md criado"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Falhar se nenhum provedor respondeu
        run: |
          if [ "${{ steps.sonda.outputs.status }}" != "0" ]; then
            echo "::error title=smoke::nenhum provedor respondeu nesta rodada (veja reports/smoke-llm.md)"
            exit 1
          fi

      - name: Guardar o relatório como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-llm
          path: reports/smoke-llm.md
          if-no-files-found: warn
